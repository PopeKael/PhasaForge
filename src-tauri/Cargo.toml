[package]
name = "phasaforge"
version = "0.5.1"
description = "A compact Thai learning companion for Windows"
authors = ["Warren Gerdes"]
edition = "2021"

[lib]
name = "phasaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
kham-core = "0.8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility", "Foundation", "Foundation_Collections", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams"] }

