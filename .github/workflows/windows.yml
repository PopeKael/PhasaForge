name: Windows validation and installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run build
      - name: Run UI logic tests
        run: npm run test:ui
      - name: Check Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Rust language and desktop tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installers
        run: npm run tauri build
      - name: Smoke-test NSIS current-user installation and uninstall
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/test-nsis.ps1
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhasaForge-Windows-${{ github.ref_name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Attach unsigned installers to private prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --title "PhasaForge ${{ github.ref_name }}" --notes-file CHANGELOG.md --prerelease
